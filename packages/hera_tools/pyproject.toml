[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-tools"
version = "0.1.0"
description = "The MCP client: server lifecycle, a namespaced tool catalogue, dispatch — plus Hera's own in-process server."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["mcp", "tools", "agent", "stdio", "streamable-http"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "hera-home",
    "hera-permissions",
    "httpx2>=2.12",
    "mcp>=2.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hera_tools"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
