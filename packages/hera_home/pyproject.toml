[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-home"
version = "0.1.0"
description = "Where Hera's data directory is, and the well-known paths inside it."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["configuration", "paths"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/hera_home"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
