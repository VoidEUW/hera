[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-providers"
version = "0.1.0"
description = "The model boundary: streaming against an OpenAI-compatible endpoint, normalised into one event union."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["llm", "streaming", "openai", "qwen", "tool-calling"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hera_providers"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
