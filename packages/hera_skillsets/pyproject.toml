[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-skillsets"
version = "0.1.0"
description = "SKILL.md packages on disk, and the router that selects them server-side."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["skills", "agent", "retrieval", "prompt"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "hera-home",
    "hera-storage",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hera_skillsets"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
