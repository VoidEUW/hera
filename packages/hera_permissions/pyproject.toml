[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-permissions"
version = "0.1.0"
description = "Whether a tool call may run: allow, deny or ask, decided by pattern and profile. Pure logic."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["permissions", "policy", "tools", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hera_permissions"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
