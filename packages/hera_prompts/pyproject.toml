[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-prompts"
version = "0.1.2"
description = "Prompt compiler: immutable, serialisable prompt state rendered into provider-neutral messages."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["prompt", "llm", "pydantic", "renderer"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hera_prompts"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
