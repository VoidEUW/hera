[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hera-accounts"
version = "0.1.0"
description = "Who is asking: users, roles, argon2id passwords, revocable sessions and one-time tokens."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Void" }]
license = { text = "MIT" }
keywords = ["accounts", "sessions", "argon2"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "hera-storage",
    "sqlmodel>=0.0.42",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hera_accounts"]

# Linting, typing, testing and coverage are configured once in the workspace root. This package
# deliberately declares none of it, so there is only ever one answer to "which config applies".
