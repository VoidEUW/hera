services:
  hera:
    build: .
    ports:
      - "8756:8756"
    volumes:
      # Everything Hera keeps lives under HERA_HOME (the database, the mind's git repo,
      # skills, memories, chats). A named volume avoids the container-UID-vs-host-UID
      # permission mismatches a bind mount hits differently on macOS/Windows Docker Desktop
      # than on native Linux.
      - hera_data:/data
      # On macOS or Linux, replace the line above with a bind mount to the same place a
      # native `uv run hera serve` already uses, so the directory is one you can open,
      # symlink or alias like any other — mind/ is a real git repository and memories/ is
      # one markdown file per memory, both meant to be seen outside Hera too:
      #     - ${HOME}/.hera:/data
      # The container then writes as root, so on native Linux (not Docker Desktop, which
      # maps this back to you already) files land root-owned until you also add
      # `user: "${UID}:${GID}"` here, with UID/GID exported from your shell.
    environment:
      HERA_HOME: /data
      HERA_HOST: 0.0.0.0
      # These seed ~/.hera/config.toml the first time it is written and are ignored after —
      # the file wins once it exists, so editing these later has no effect on a volume that
      # already has one. Change the model on the Settings screen instead.
      #
      # host.docker.internal reaches an OpenAI-compatible endpoint (LM Studio, Ollama, ...)
      # running on the machine hosting Docker. It resolves out of the box on Docker Desktop
      # (macOS, Windows); extra_hosts below is what makes it resolve on Linux too.
      HERA_PROVIDER_BASE_URL: "http://host.docker.internal:1234/v1"
      HERA_PROVIDER_MODEL: "qwen3.6-35b"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  hera_data:
