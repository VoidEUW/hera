name: Preview

# What a change looks like, on the request itself. Builds the real interface, serves it from a
# real server with a scripted model behind it, and walks a browser through every state a reviewer
# would want to see -- the start page, the waiting mark mid-breath, answers, a long tool trace, a
# turn that could not start, a turn cut off part way through, the question card, the rail, the
# composer's controls, all seven Settings tabs, the profile menu, light and dark, reduced motion,
# and the phone -- filming the desktop and the phone and screenshotting each state.
#
# It also records what the browser said: console messages, uncaught page errors, and any request
# that failed or came back 4xx/5xx. A screenshot cannot show a message, and a request that 404s
# looks exactly like a request that never happened, so without this the capture cannot tell a
# reviewer that something went wrong. All of it lands in preview-media/manifest.json and
# preview-media/console.log, and the summary below puts the counts on the run page.
#
# No live endpoint, nothing deployed, everything disposable. A scene that fails is recorded and
# stepped over rather than failing the job: a missing frame is worth knowing about, and it is not a
# reason to throw away the other thirty.
#
# This job only films and uploads; preview-comment.yml (workflow_run) publishes the media to
# the previews-media branch and comments on the pull request. Keeping the two apart is what
# lets the flow work for pull requests opened from forks: this run holds a read-only token,
# and the follow-up run in this repository holds the write token.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to film, e.g. 50
        required: true

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A dispatch (from a /preview comment) runs on the default branch, so ask for the
      # pull request's head explicitly. Plain pull_request runs keep the default checkout.
      # The ref is taken from an untrusted input, so the checkout must not persist the token
      # into .git/config (CodeQL: cache poisoning via execution of untrusted code).
      - uses: actions/checkout@v4
        if: inputs.pr_number
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false
      - uses: actions/checkout@v4
        if: ${{ !inputs.pr_number }}
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-workspace
        with:
          # A dispatch checkouts refs/pull/<n>/head, i.e. untrusted code; both cache triggers
          # must be off so the default-branch cache cannot be poisoned (CodeQL cache-poisoning).
          cache: ${{ !inputs.pr_number }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Same cache token: keep npm cold on the dispatch path.
          cache: ${{ !inputs.pr_number && 'npm' || '' }}
          cache-dependency-path: apps/core/web/package-lock.json

      - name: Build the interface
        working-directory: apps/core/web
        run: npm ci && npm run build

      - name: Install the browser
        run: uv run playwright install chromium --with-deps

      - name: Film the walkthrough
        run: uv run python tests/e2e/capture_preview.py preview-media

      # The counts on the run page itself, so a reviewer learns that a scene was missed without
      # downloading an artifact. `continue-on-error` because the job's verdict belongs to the
      # checks: a summary that cannot be written is not a failed capture.
      - name: Summarise what was filmed
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          report = json.loads(pathlib.Path("preview-media/manifest.json").read_text("utf-8"))
          print("### Preview walkthrough\n")
          print(
              f"{report['ran']}/{report['scenes']} scenes, "
              f"{len(report['screenshots'])} screenshots, "
              f"{len(report['videos'])} videos"
          )
          print(
              f"\nBrowser console: {report['console_messages']} messages, "
              f"{report['page_errors']} uncaught page errors, "
              f"{report['failed_requests']} failed requests"
          )
          broken = [s for s in report["detail"] if not s["ok"]]
          if broken:
              print("\n#### Scenes that did not run\n")
              print("| Scene | What went wrong |")
              print("| --- | --- |")
              for scene in broken:
                  print(f"| `{scene['name']}` | {scene['problem']} |")
          PY

      # Dispatched runs carry the default branch's identity, so the follow-up comment job
      # cannot learn which pull request to report on from the run itself. Leave the number
      # inside the artifact instead.
      - name: Note which pull request this is
        run: echo "${{ github.event.pull_request.number || inputs.pr_number || '' }}" > preview-media/pr-number

      # The whole directory, so manifest.json and console.log travel with the pictures: the
      # pictures are what a reviewer looks at, and these two are what they ask for when a picture
      # is not enough.
      - name: Upload the media
        uses: actions/upload-artifact@v7
        with:
          name: preview-media
          path: preview-media/
          retention-days: 14
          if-no-files-found: error
