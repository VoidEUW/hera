name: CodeQL

# The `protect-main` ruleset requires a CodeQL result before a pull request can merge, so this
# workflow is what makes that rule satisfiable rather than a permanent block. Advanced setup
# rather than GitHub's default setup, for the same reason `ci.yml` lives here: the configuration
# is reviewable in a pull request instead of living only in repository settings.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published query finds existing code without waiting for a push.
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      # Uploading results is what satisfies the ruleset; the other two are the documented
      # minimum for the action and are not granted at the workflow level.
      security-events: write
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflows themselves. Worth having: CI here runs on
        # pull_request and caches, which is the shape most workflow findings are about.
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # The default suite, deliberately: it is the security queries only. The wider
          # `security-and-quality` suite was tried and every finding it added was a false
          # positive -- `assert` after `raise` inside `with pytest.raises(...)` read as
          # unreachable, SQLAlchemy's `@declared_attr.directive def __table_args__(cls)` read
          # as a method that should take `self`, and an import kept for its side effect read as
          # unused. ruff and mypy already hold this repository's quality bar and understand
          # those idioms. With `required_review_thread_resolution` on the ruleset, a noisy
          # query is not merely noise: each false positive blocks the merge until dismissed.

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
