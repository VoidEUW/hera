name: Preview command

# The on-demand half of the preview flow. A comment saying "/preview" on a pull request
# re-films that pull request by rerunning the latest push-triggered capture for its head;
# the rerun fires preview-comment.yml like any other capture, and the walkthrough comment
# updates in place. Restricted to people with write access -- a stranger's comment must not
# queue a five-minute job.
#
# Why a rerun instead of a blank workflow_dispatch: runs started by GITHUB_TOKEN via the
# dispatch endpoint do not cascade into workflow_run events, so the comment job would never
# wake. A rerun of an existing pull_request run is a fresh execution of the same event and
# cascades normally. Runs are only rerun when their head SHA is the pull request's current
# head, so an outdated capture never overwrites a newer one.
#
# The run is looked up by `head_sha` rather than by paging through recent `pull_request` runs
# and comparing. The windowed version asked for the twenty most recent across the whole
# repository, which is a limit no single pull request controls: on a busy repository -- and
# dependabot opens a new run on every merged one -- a pull request's own capture slides out of
# the top twenty and `/preview` reports that there is nothing to re-film for a pull request
# that has one. The API filters on `head_sha`, so there is no window to fall out of.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  rerun:
    if: >-
      ${{
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/preview') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMENT_ID: ${{ github.event.comment.id }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Rerun the latest capture for the current head
        run: |
          set -euo pipefail

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes || echo "::warning::Could not react to the comment; continuing."

          read -r head_sha head_branch < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '"\(.head.sha) \(.head.ref)"'
          )

          # **A push and a `/preview` are four seconds apart, and that is not an edge case.**
          # Somebody pushes, reads the URL, and types the command; GitHub has not created the
          # `pull_request` run yet, and the honest answer at that moment is "in a moment" rather
          # than "there is nothing to re-film". A capture is created within a second or two of
          # the push, so a short bounded wait turns the common case into a rerun. The previous
          # version asked once and exited non-zero, which made the ordinary race look like a
          # broken workflow -- and then died trying to say so, because posting a comment is a
          # permission this workflow may not have (see the note below).
          #
          # The window is 3 minutes across 12 polls, and it stops as soon as a run appears.
          run_id=""
          for attempt in $(seq 1 12); do
            run_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/preview.yml/runs?head_sha=${head_sha}&per_page=1" \
                --jq '.workflow_runs[0].id // ""'
            )"
            [ -n "$run_id" ] && break
            [ "$attempt" -lt 12 ] && sleep 15
          done

          if [ -z "$run_id" ]; then
            message="No push-triggered capture exists for the current head of \`${head_branch}\` to rerun. \`/preview\` has nothing to re-film yet: GitHub may still be creating one, and if not, push a commit (even an empty one) to make it."
            # Said in the step summary as well as the comment, because the comment is the thing
            # that has been failing: if the token cannot write to the issue, the run summary is
            # the only place the reason survives, and a red run that says nothing is the worst of
            # the three outcomes.
            {
              echo "### /preview had nothing to rerun"
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
            # Best effort, and deliberately not fatal. A 403 here must not become the failure the
            # person has to read, because the request failing is already reported above.
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$message" \
              || echo "::warning::Could not comment on the pull request; the reason is in the job summary."
            # Zero rather than one: nothing is broken. The pipeline did not fail and neither did
            # this workflow -- there was simply nothing yet to re-film, and saying so is a
            # successful answer to the question that was asked.
            exit 0
          fi

          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
          if [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
            echo "A capture for ${head_branch}@${head_sha} is already running (${run_id}); it will update the comment when it finishes."
            exit 0
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun" -X POST
          echo "Rerunning preview capture ${run_id} for ${head_branch}@${head_sha}."
