name: Release

# Two tag shapes:
#   v1.2.3                  the application
#   hera-prompts-v0.1.3     a single package, so a consumer can pin one library without
#                           pinning Hera (see CONTRIBUTING.md, "Using one package somewhere else")
#
# Releases are published from the tag and nothing else. The notes are the changelog: they are
# built from Conventional Commit titles by .github/scripts/release_notes.py, so there is no file
# to keep up. A version with a suffix (v0.2.1-rc4) is a pre-release -- marked as one, never the
# repository's "latest", and listing what changed since the previous tag; a plain version is a
# release listing everything since the previous plain one, so it covers all of its candidates.
#
# Run by hand with a tag name, it publishes nothing and prints the notes that tag would get.
on:
  push:
    tags:
      - "v*"
      - "hera-*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to write notes for, e.g. v0.2.1-rc4 -- or one not made yet, e.g. v0.2.1"
        required: true
      rev:
        description: "The commit the notes run up to (default: the tag; use HEAD for a tag not made yet)"
        required: false

permissions:
  contents: write

jobs:
  # The dry run: notes into the job summary, nothing published, nothing tagged.
  preview:
    name: preview notes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Write the notes
        env:
          TAG: ${{ inputs.tag }}
          REV: ${{ inputs.rev }}
          REPOSITORY: ${{ github.repository }}
        run: |
          package=""
          if [[ "$TAG" =~ ^(hera-[a-z0-9-]+)-v[0-9] ]]; then
            package="${BASH_REMATCH[1]}"
          fi
          args=(--tag "$TAG" --repo "$REPOSITORY" --rev "${REV:-$TAG}")
          if [ -n "$package" ]; then
            args+=(--path "packages/${package//-/_}")
          fi
          {
            echo "## Notes for \`$TAG\`"
            echo
            python3 .github/scripts/release_notes.py "${args[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Read by the docker-image job below, so it can tell an application tag from a package
    # tag without re-deriving the regex a second place could disagree with.
    outputs:
      package: ${{ steps.target.outputs.package }}
      version: ${{ steps.target.outputs.version }}
      prerelease: ${{ steps.target.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out what is being released
        id: target
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^(hera-[a-z0-9-]+)-v[0-9] ]]; then
            package="${BASH_REMATCH[1]}"
            echo "package=$package" >> "$GITHUB_OUTPUT"
            echo "directory=packages/${package//-/_}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_OUTPUT"
          else
            echo "package=" >> "$GITHUB_OUTPUT"
            # The application is `hera-core` at apps/core, and its pyproject is what
            # `hera_core.__version__` reads back out of the installed distribution — so this
            # is the file the tag has to agree with for the About box to be telling the truth.
            echo "directory=apps/core" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          # A suffix after the three numbers -- -rc1, -beta2 -- is what makes it a pre-release.
          if [[ "$GITHUB_REF_NAME" =~ ^(hera-[a-z0-9-]+-)?v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Every tag, the application's included. The version is declared in exactly one file per
      # thing that can be released and read back from packaging at runtime, so this is the only
      # place the two could drift apart -- and it is a release that fails rather than an
      # interface quietly showing the version of the release before it.
      - name: Check the tag matches the declared version
        run: |
          directory='${{ steps.target.outputs.directory }}'
          declared=$(grep -m1 '^version = ' "$directory/pyproject.toml" | cut -d'"' -f2)
          tagged='${{ steps.target.outputs.version }}'
          if [ "$declared" != "$tagged" ]; then
            echo "::error::$directory/pyproject.toml declares $declared but the tag says $tagged"
            exit 1
          fi

      - uses: ./.github/actions/setup-python-workspace
        if: steps.target.outputs.package != ''

      - name: Build the package
        if: steps.target.outputs.package != ''
        run: uv build --package '${{ steps.target.outputs.package }}' --out-dir dist

      # Grouped by Conventional Commit type. The application's notes are every commit in the range;
      # a package's are the ones touching its directory, because the rest is not in its wheel.
      - name: Write the release notes
        env:
          PACKAGE: ${{ steps.target.outputs.package }}
          DIRECTORY: ${{ steps.target.outputs.directory }}
        run: |
          args=(--tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY")
          if [ -n "$PACKAGE" ]; then
            args+=(--path "$DIRECTORY")
          fi
          python3 .github/scripts/release_notes.py "${args[@]}" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: ${{ steps.target.outputs.package != '' && 'dist/*' || '' }}
          generate_release_notes: false
          # A release candidate is a pre-release and never "latest". Of the rest only the
          # application's tag is: a package's tag must not become what the repository calls its
          # latest release.
          prerelease: ${{ steps.target.outputs.prerelease }}
          make_latest: ${{ steps.target.outputs.prerelease == 'false' && steps.target.outputs.package == '' }}

  # Only for the application tag (v1.2.3) -- a package tag (hera-prompts-v0.1.3) releases a
  # wheel, not something Dockerfile knows how to build. Depends on `release` rather than
  # duplicating its tag-parsing, so there is exactly one place that decides what a tag means.
  docker-image:
    name: docker image
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.package == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Both, not just amd64: Docker Desktop on Apple Silicon is the common macOS case this
      # image is meant to cover, and the workspace's dependencies all ship arm64 wheels, so
      # this is a download rather than a QEMU-emulated compile.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        run: |
          # ghcr.io refuses an uppercase repository path; the GitHub org/repo name isn't
          # guaranteed to be lowercase.
          repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          version='${{ needs.release.outputs.version }}'
          tags="ghcr.io/$repository:$version"
          # `latest` is always the newest *release*, so pulling it can never hand somebody a
          # release candidate by surprise; `rc` is the newest candidate, for whoever wants one.
          if [[ "$version" != *-* ]]; then
            tags="$tags,ghcr.io/$repository:latest"
          else
            tags="$tags,ghcr.io/$repository:rc"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
