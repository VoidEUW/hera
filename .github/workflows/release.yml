name: Release

# Two tag shapes:
#   v1.2.3                  the application
#   hera-prompts-v0.1.3     a single package, so a consumer can pin one library without
#                           pinning Hera (see CONTRIBUTING.md, "Using one package somewhere else")
on:
  push:
    tags:
      - "v*"
      - "hera-*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Read by the docker-image job below, so it can tell an application tag from a package
    # tag without re-deriving the regex a second place could disagree with.
    outputs:
      package: ${{ steps.target.outputs.package }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out what is being released
        id: target
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^(hera-[a-z0-9-]+)-v[0-9] ]]; then
            package="${BASH_REMATCH[1]}"
            echo "package=$package" >> "$GITHUB_OUTPUT"
            echo "directory=packages/${package//-/_}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_OUTPUT"
          else
            echo "package=" >> "$GITHUB_OUTPUT"
            # The application is `hera-core` at apps/core, and its pyproject is what
            # `hera_core.__version__` reads back out of the installed distribution — so this
            # is the file the tag has to agree with for the About box to be telling the truth.
            echo "directory=apps/core" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Every tag, the application's included. The version is declared in exactly one file per
      # thing that can be released and read back from packaging at runtime, so this is the only
      # place the two could drift apart -- and it is a release that fails rather than an
      # interface quietly showing the version of the release before it.
      - name: Check the tag matches the declared version
        run: |
          directory='${{ steps.target.outputs.directory }}'
          declared=$(grep -m1 '^version = ' "$directory/pyproject.toml" | cut -d'"' -f2)
          tagged='${{ steps.target.outputs.version }}'
          if [ "$declared" != "$tagged" ]; then
            echo "::error::$directory/pyproject.toml declares $declared but the tag says $tagged"
            exit 1
          fi

      - uses: ./.github/actions/setup-python-workspace
        if: steps.target.outputs.package != ''

      - name: Build the package
        if: steps.target.outputs.package != ''
        run: uv build --package '${{ steps.target.outputs.package }}' --out-dir dist

      - name: Collect the changes since the previous tag
        id: notes
        run: |
          pattern='v[0-9]*'
          if [ -n '${{ steps.target.outputs.package }}' ]; then
            pattern='${{ steps.target.outputs.package }}-v[0-9]*'
          fi
          previous=$(git describe --tags --abbrev=0 --match "$pattern" "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi
          {
            echo "body<<HERA_EOF"
            git log --no-merges --pretty='- %s (%h)' "$range" -- '${{ steps.target.outputs.directory }}'
            echo "HERA_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: ${{ steps.target.outputs.package != '' && 'dist/*' || '' }}
          generate_release_notes: false

  # Only for the application tag (v1.2.3) -- a package tag (hera-prompts-v0.1.3) releases a
  # wheel, not something Dockerfile knows how to build. Depends on `release` rather than
  # duplicating its tag-parsing, so there is exactly one place that decides what a tag means.
  docker-image:
    name: docker image
    needs: release
    if: needs.release.outputs.package == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Both, not just amd64: Docker Desktop on Apple Silicon is the common macOS case this
      # image is meant to cover, and the workspace's dependencies all ship arm64 wheels, so
      # this is a download rather than a QEMU-emulated compile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        run: |
          # ghcr.io refuses an uppercase repository path; the GitHub org/repo name isn't
          # guaranteed to be lowercase.
          repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          version='${{ needs.release.outputs.version }}'
          tags="ghcr.io/$repository:$version"
          # A pre-release version (anything with a -rc1-shaped suffix) never becomes `latest`,
          # so pulling that tag can't hand somebody a release candidate by surprise.
          if [[ "$version" != *-* ]]; then
            tags="$tags,ghcr.io/$repository:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
