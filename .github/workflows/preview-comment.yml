name: Preview comment

on:
  workflow_run:
    workflows: [Preview]
    types: [completed]

# Contents: commit the media. Pull requests / issues: write and update the comment.

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: preview-comment
  cancel-in-progress: false

jobs:
  publish:
    # Cancelled runs are a newer capture taking over; their half-filmed output would only
    # make the comment stale. pull_request covers pushes (including reruns from /preview);
    # workflow_dispatch covers manual re-films from the Actions tab.
    if: >-
      ${{ (github.event.workflow_run.event == 'pull_request' ||
           github.event.workflow_run.event == 'workflow_dispatch') &&
           github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      EVENT: ${{ github.event_name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_REPO_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
    steps:
      - name: Find the pull request
        id: pr
        run: |
          set -euo pipefail
          # workflow_run for fork pull requests often reports an empty pull_requests array,
          # so resolve via head branch instead. Reopening a closed pull request keeps the
          # old branch around too; only open pull requests are considered.
          number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${HEAD_REPO_OWNER}:${HEAD_BRANCH}&state=open" --jq '.[0].number // ""')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Fetch the filmed media
        if: env.CONCLUSION == 'success'
        uses: actions/download-artifact@v8
        with:
          name: preview-media
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: media/

      - name: Find the pull request from the marker
        id: pr_marker
        if: (steps.pr.outputs.number || '') == '' && env.CONCLUSION == 'success'
        run: |
          set -euo pipefail
          # A capture dispatched by hand ran on the default branch, so the run's own branch
          # does not name the pull request. The capture leaves the number in the artifact
          # (preview.yml, "Note which pull request this is").
          marker="media/pr-number"
          number="$( [ -f "$marker" ] && tr -d ' \n\r' < "$marker" || true)"
          if [ -z "$number" ]; then
            echo "No pull request points at ${HEAD_SHA} and the artifact has no marker; nothing to report on."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq '.state' | grep -qx open || exit 0
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Publish media to the previews branch
        if: (steps.pr.outputs.number || steps.pr_marker.outputs.number) && env.CONCLUSION == 'success'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.pr_marker.outputs.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dest="pr-${PR_NUMBER}"
          # Not every runner image ships ffmpeg.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          # The download lives outside the repo so switching branches cannot collide with it.
          mv media /tmp/preview-media-artifact
          # Pull request comments strip <video> tags; a GIF renders inline everywhere. Two
          # passes with a 160-colour palette keep it watchable without exploding the size, and
          # it is cut to 30 seconds so the comment stays well under the embedding limit. The
          # film is recorded at 1080p; 1280 px wide keeps the GIF readable and light.
          #
          # By name, and the desktop's: the capture names its recordings, and the first version
          # took `head -1` of a glob of Playwright's random page ids -- which with two recordings
          # left a coin toss deciding whether a reviewer watched the desktop or the phone.
          video=/tmp/preview-media-artifact/videos/desktop.webm
          [ -f "$video" ] || video="$(ls /tmp/preview-media-artifact/videos/*.webm 2>/dev/null | head -1 || true)"
          if [ -n "$video" ] && [ -f "$video" ]; then
            ffmpeg -hide_banner -loglevel error -t 30 -i "$video" \
              -vf "fps=12,scale=1280:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=160[p];[s1][p]paletteuse=dither=bayer" \
              -loop 0 "${video%.webm}.gif"
          fi
          # Snapshot the screenshot filenames before they leave the working tree, so the
          # comment step (which runs after media/ is gone) can still list them.
          find /tmp/preview-media-artifact/screenshots -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort > /tmp/preview-media-shot-list
          if git ls-remote --exit-code --heads origin previews-media >/dev/null 2>&1; then
            git fetch origin previews-media
            git checkout previews-media
            git reset --hard origin/previews-media
          else
            git checkout --orphan previews-media
            git rm -rf . || true
          fi
          rm -rf "$dest"
          mkdir -p "$dest"
          rm -f /tmp/preview-media-artifact/pr-number
          cp -r /tmp/preview-media-artifact/. "$dest/"
          git add -A
          if git diff --cached --quiet; then
            echo "Media unchanged for PR #${PR_NUMBER}; skipping the commit."
          else
            git commit -m "Preview media for PR #${PR_NUMBER}"
            git push origin previews-media
          fi
          if [ -n "$video" ]; then
            echo "PREVIEW_VIDEO=$(basename "$video")" >> "$GITHUB_ENV"
            echo "PREVIEW_GIF=$(basename "${video%.webm}.gif")" >> "$GITHUB_ENV"
          fi

      # Builds and posts the comment in one step, in Node rather than shell.
      #
      # Two reasons. The body is a table per group of states now, and every row has to be checked
      # against what was actually filmed -- a scene that failed must drop out rather than leave a
      # broken image -- which is list handling, not string concatenation. And the captions contain
      # apostrophes and dashes, which in a shell `echo` are a quoting problem rather than text.
      - name: Post or update the pull request comment
        if: steps.pr.outputs.number || steps.pr_marker.outputs.number
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.pr_marker.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- preview-walkthrough -->';
            const { owner, repo } = context.repo;
            const number = Number(process.env.PR_NUMBER);
            const runId = process.env.RUN_ID;
            const finished = process.env.CONCLUSION !== 'success';
            const artifact = '/tmp/preview-media-artifact';
            const root = `https://raw.githubusercontent.com/${owner}/${repo}/previews-media/pr-${number}`;
            const shots = `${root}/screenshots`;

            // What a reviewer most wants to see, in the order a conversation happens. Everything
            // else is listed under "All screenshots" below, so this is highlights, not an index.
            const groups = [
              ['The start, and the mark while it breathes',
                ['01-start', '02-waiting-feather', '03-waiting-eye']],
              ['A turn, and a long tool trace',
                ['04-first-answer', '05-long-trace-collapsed', '06-long-trace-open']],
              ['The three ways a turn ends',
                ['07-turn-refused', '08-turn-cut-off', '09-answer-after-both']],
              ['She asks, and waits for you',
                ['13-the-question-card', '14-the-reply-resumed', '40-profile-menu']],
              ['Settings',
                ['30-settings-models', '34-settings-memory', '35-settings-mind']],
              ['Light, reduced motion, and the model menu',
                ['41-light-start', '50-reduced-motion-settings', '20-model-dropdown']],
              ['The phone',
                ['70-phone-start', '71-phone-rail', '72-phone-answer']],
            ];
            // "07-turn-refused" reads as "Turn refused": the number orders the walkthrough and
            // says nothing in a caption.
            const caption = (name) => {
              const words = name.split('-').slice(1).join(' ');
              return words.charAt(0).toUpperCase() + words.slice(1);
            };

            const out = [marker, '### Preview walkthrough', ''];
            if (finished) {
              out.push(
                `The latest preview capture for this pull request did not finish. ` +
                `Click through to the run to see why: ` +
                `https://github.com/${owner}/${repo}/actions/runs/${runId}`,
              );
            } else {
              out.push(
                `Latest capture: [run ${runId}]` +
                `(https://github.com/${owner}/${repo}/actions/runs/${runId})`,
              );

              let filmed = new Set();
              const manifest = `${artifact}/manifest.json`;
              if (fs.existsSync(manifest)) {
                const r = JSON.parse(fs.readFileSync(manifest, 'utf8'));
                filmed = new Set(r.screenshots);
                out.push(
                  '',
                  `${r.ran}/${r.scenes} scenes, ${r.screenshots.length} screenshots, ` +
                  `${r.videos.length} videos. Browser console: ` +
                  `${r.console_messages} messages, ${r.page_errors} uncaught page errors, ` +
                  `${r.failed_requests} failed requests.`,
                );
                const broken = r.detail.filter((s) => !s.ok);
                if (broken.length) {
                  out.push('', 'Some scenes did not run, so frames below are missing:');
                  for (const s of broken) out.push(`- \`${s.name}\` — ${s.problem}`);
                }
              }

              for (const [title, names] of groups) {
                const present = filmed.size ? names.filter((n) => filmed.has(`${n}.png`)) : names;
                if (!present.length) continue;
                out.push('', `#### ${title}`, '');
                out.push(`| ${present.map(caption).join(' | ')} |`);
                out.push(`| ${present.map(() => '---').join(' | ')} |`);
                out.push(`| ${present.map((n) => `![](${shots}/${n}.png)`).join(' | ')} |`);
              }

              const gif = process.env.PREVIEW_GIF;
              if (gif) {
                out.push('', '#### Video', '');
                out.push(`![Turn walkthrough](${root}/videos/${gif})`, '');
                out.push(`[Full-quality webm](${root}/videos/${process.env.PREVIEW_VIDEO}) · ` +
                        `[Phone, full quality](${root}/videos/phone.webm)`);
              }

              out.push('', '<details><summary>All screenshots, and what the browser said</summary>', '');
              const all = filmed.size
                ? [...filmed].sort()
                : fs.readFileSync('/tmp/preview-media-shot-list', 'utf8').split('\n')
                    .map((s) => s.trim()).filter(Boolean);
              for (const name of all) out.push(`- [${name}](${shots}/${name})`);
              out.push(
                '',
                `- [manifest.json](${root}/manifest.json) — what ran, how long it took, and what did not`,
                `- [console.log](${root}/console.log) — every console message, uncaught page ` +
                `error, and failed request`,
                '',
                '</details>',
              );
            }

            const body = out.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated comment ${existing.id} on PR #${number}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              core.info(`Posted walkthrough comment on PR #${number}`);
            }
