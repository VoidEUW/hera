name: Preview comment

on:
  workflow_run:
    workflows: [Preview]
    types: [completed]

# Contents: commit the media. Pull requests / issues: write and update the comment.

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: preview-comment
  cancel-in-progress: false

jobs:
  publish:
    # Cancelled runs are a newer capture taking over; their half-filmed output would only
    # make the comment stale. pull_request covers pushes (including reruns from /preview);
    # workflow_dispatch covers manual re-films from the Actions tab.
    if: >-
      ${{ (github.event.workflow_run.event == 'pull_request' ||
           github.event.workflow_run.event == 'workflow_dispatch') &&
           github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      EVENT: ${{ github.event_name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_REPO_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
    steps:
      - name: Find the pull request
        id: pr
        run: |
          set -euo pipefail
          # workflow_run for fork pull requests often reports an empty pull_requests array,
          # so resolve via head branch instead. Reopening a closed pull request keeps the
          # old branch around too; only open pull requests are considered.
          number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${HEAD_REPO_OWNER}:${HEAD_BRANCH}&state=open" --jq '.[0].number // ""')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Fetch the filmed media
        if: env.CONCLUSION == 'success'
        uses: actions/download-artifact@v4
        with:
          name: preview-media
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: media/

      - name: Find the pull request from the marker
        id: pr_marker
        if: (steps.pr.outputs.number || '') == '' && env.CONCLUSION == 'success'
        run: |
          set -euo pipefail
          # A capture dispatched by hand ran on the default branch, so the run's own branch
          # does not name the pull request. The capture leaves the number in the artifact
          # (preview.yml, "Note which pull request this is").
          marker="media/pr-number"
          number="$( [ -f "$marker" ] && tr -d ' \n\r' < "$marker" || true)"
          if [ -z "$number" ]; then
            echo "No pull request points at ${HEAD_SHA} and the artifact has no marker; nothing to report on."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq '.state' | grep -qx open || exit 0
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Publish media to the previews branch
        if: (steps.pr.outputs.number || steps.pr_marker.outputs.number) && env.CONCLUSION == 'success'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.pr_marker.outputs.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dest="pr-${PR_NUMBER}"
          # Not every runner image ships ffmpeg.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          # The download lives outside the repo so switching branches cannot collide with it.
          mv media /tmp/preview-media-artifact
          # Pull request comments strip <video> tags; a GIF renders inline everywhere. Two
          # passes with a 160-colour palette keep it watchable without exploding the size, and
          # it is cut to 30 seconds so the comment stays well under the embedding limit. The
          # film is recorded at 1080p; 1280 px wide keeps the GIF readable and light.
          video="$(ls /tmp/preview-media-artifact/videos/*.webm 2>/dev/null | head -1 || true)"
          if [ -n "$video" ]; then
            ffmpeg -hide_banner -loglevel error -t 30 -i "$video" \
              -vf "fps=12,scale=1280:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=160[p];[s1][p]paletteuse=dither=bayer" \
              -loop 0 "${video%.webm}.gif"
          fi
          # Snapshot the screenshot filenames before they leave the working tree, so the
          # comment step (which runs after media/ is gone) can still list them.
          find /tmp/preview-media-artifact/screenshots -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort > /tmp/preview-media-shot-list
          if git ls-remote --exit-code --heads origin previews-media >/dev/null 2>&1; then
            git fetch origin previews-media
            git checkout previews-media
            git reset --hard origin/previews-media
          else
            git checkout --orphan previews-media
            git rm -rf . || true
          fi
          rm -rf "$dest"
          mkdir -p "$dest"
          rm -f /tmp/preview-media-artifact/pr-number
          cp -r /tmp/preview-media-artifact/. "$dest/"
          git add -A
          if git diff --cached --quiet; then
            echo "Media unchanged for PR #${PR_NUMBER}; skipping the commit."
          else
            git commit -m "Preview media for PR #${PR_NUMBER}"
            git push origin previews-media
          fi
          if [ -n "$video" ]; then
            echo "PREVIEW_VIDEO=$(basename "$video")" >> "$GITHUB_ENV"
            echo "PREVIEW_GIF=$(basename "${video%.webm}.gif")" >> "$GITHUB_ENV"
          fi

      - name: Write the comment body
        if: steps.pr.outputs.number || steps.pr_marker.outputs.number
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.pr_marker.outputs.number }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/previews-media/pr-${PR_NUMBER}/screenshots"
          {
            echo "<!-- preview-walkthrough -->"
            if [ "${{ env.CONCLUSION != 'success' }}" = "true" ]; then
              echo "### Preview walkthrough"
              echo
              echo "The latest preview capture for this pull request did not finish. Click through to the run to see why: <https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}>"
            else
              echo "### Preview walkthrough"
              echo
              echo "Latest capture: [run ${RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID})"
              echo
              echo "| Start | Waiting (feather) | Waiting (eye) |"
              echo "| --- | --- | --- |"
              echo "| ![]($base/01-start.png) | ![]($base/02-waiting-feather.png) | ![]($base/03-waiting-eye.png) |"
              echo
              echo "| First answer | Long trace (collapsed) | Long trace (open) |"
              echo "| --- | --- | --- |"
              echo "| ![]($base/04-first-answer.png) | ![]($base/05-long-trace-collapsed.png) | ![]($base/06-long-trace-open.png) |"
              echo
              echo "| Phone: start | Phone: answered |"
              echo "| --- | --- |"
              echo "| ![]($base/07-start-phone.png) | ![]($base/08-answer-phone.png) |"
              if [ -n "${PREVIEW_GIF:-}" ]; then
                echo
                echo "### Video"
                echo
                echo "![Turn walkthrough](${base%/screenshots}/videos/${PREVIEW_GIF})"
                echo
                echo "[Full-quality webm](${base%/screenshots}/videos/${PREVIEW_VIDEO})"
              fi
              echo
              echo "<details><summary>Plain links</summary>"
              echo
              while IFS= read -r name; do
                [ -z "$name" ] && continue
                echo "- [$name]($base/$name)"
              done < /tmp/preview-media-shot-list
              echo
              echo "</details>"
            fi
          } > body.md

      - name: Post or update the pull request comment
        if: steps.pr.outputs.number || steps.pr_marker.outputs.number
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.pr_marker.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- preview-walkthrough -->';
            const body = fs.readFileSync('body.md', 'utf8');
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: Number(process.env.PR_NUMBER), per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated comment ${existing.id} on PR #${process.env.PR_NUMBER}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: Number(process.env.PR_NUMBER), body,
              });
              core.info(`Posted walkthrough comment on PR #${process.env.PR_NUMBER}`);
            }
