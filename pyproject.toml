[project]
name = "hera"
version = "0.1.0.dev0"
description = "Hera — a self-hosted agentic chat space: MCP tools, SKILL.md skills, a git-versioned mind."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Lukas Kreuz" }]
license = { text = "MIT" }
dependencies = []

# The workspace root is a container, not a distribution: nothing installs `hera` itself.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/core"]

# Every member another member depends on needs an entry here, or `uv sync` fails with
# "included as a workspace member, but is missing an entry in tool.uv.sources".
# It is also what lets an outside project depend on one package through a git subdirectory:
# uv then resolves that package's internal dependencies from the same commit, with no extra
# declarations on the consumer's side. tests/test_workspace.py checks the list stays complete.
[tool.uv.sources]
hera-home = { workspace = true }
hera-permissions = { workspace = true }
hera-profiles = { workspace = true }
hera-prompts = { workspace = true }
hera-providers = { workspace = true }
hera-storage = { workspace = true }
hera-tools = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "coverage>=7.6",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    # Needed at the workspace root for the pydantic mypy plugin to load.
    "pydantic>=2.9",
    "pre-commit>=4.6.2",
    # Serves a real MCP server over HTTP in the hera_tools transport tests. It arrives with
    # the MCP SDK anyway; declared here so the suite does not depend on that staying true.
    "uvicorn>=0.30",
]

# ---------------------------------------------------------------------------
# Shared tool configuration. Every package inherits this; a package only adds a
# `[tool.ruff.lint.per-file-ignores]` entry when it has a documented reason to.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["packages", "apps/core/src", "tests"]
extend-exclude = ["*.md", "apps/core/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test models and fixtures legitimately use untyped and dynamic constructs.
"**/tests/*" = ["ANN401"]
"tests/*" = ["ANN401"]
# These two implement signatures that are a fixed contract for everything built on top: an
# explicit TypeVar instead of PEP 695 type parameters (UP046/UP047), and `Any` for SQLAlchemy
# filter expressions and **changes (ANN401).
"packages/hera_storage/src/hera_storage/repository.py" = ["UP046", "ANN401"]
"packages/hera_storage/src/hera_storage/versioning.py" = ["UP047", "ANN401"]
# Canonical JSON encoding accepts whatever pydantic dumped. Spelling that as a recursive
# JSON alias buys no safety -- the input is already `model_dump(mode="json")` output -- and
# costs a cast at every call site (ANN401).
"packages/hera_prompts/src/hera_prompts/canonical.py" = ["ANN401"]
# `**updates` is forwarded straight into `model_dump()` and back through validation, so the
# field types live on the models rather than on these two helpers (ANN401).
"packages/hera_prompts/src/hera_prompts/prompt.py" = ["ANN401"]
# This one reads a JSON document someone else wrote. `json.loads` produces `Any` by
# definition, and the whole job of the module is narrowing that into typed models -- the
# helpers doing the narrowing have to accept it (ANN401).
"packages/hera_tools/src/hera_tools/config.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Listed explicitly, one entry per workspace member: mypy treats a glob that matches nothing as
# a literal path, so `packages/*` cannot be used while a member is still missing.
# tests/test_docs.py::test_mypy_checks_every_package fails if an entry is forgotten.
files = [
    "tests",
    "packages/hera_home/src",
    "packages/hera_home/tests",
    "packages/hera_permissions/src",
    "packages/hera_permissions/tests",
    "packages/hera_profiles/src",
    "packages/hera_profiles/tests",
    "packages/hera_prompts/src",
    "packages/hera_prompts/tests",
    "packages/hera_providers/src",
    "packages/hera_providers/tests",
    "packages/hera_storage/src",
    "packages/hera_storage/tests",
    "packages/hera_tools/src",
    "packages/hera_tools/tests",
]

# Two packages with a conftest.py resolve to one module name -- mypy derives it from the file
# name, and pytest requires that name. pytest itself is fine because it loads conftest by path;
# mypy has no equivalent, and refuses to check either file rather than pick one. Excluding them
# is the narrowest fix available: ruff still lints them under the full rule set including ANN,
# and a fixture that does not type-check shows up as a failure in every test that uses it.
exclude = ["/tests/conftest\\.py$"]

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "apps/core/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "e2e: end-to-end tests driving a real server (deselect with '-m \"not e2e\"')",
    "live: needs a reachable model endpoint; never runs in CI",
]

# Coverage runs as `coverage run -m pytest`, not through --cov: hera_storage ships a pytest11
# plugin, so pytest imports it while loading entry points -- before pytest-cov could start
# tracing. Everything at module level would count as unmeasured.
[tool.coverage.run]
# `apps/core/src` joins this list when the application exists; coverage warns on every run about
# a source that is not importable yet. tests/test_workspace.py fails if a member is forgotten.
source = ["packages"]
omit = ["*/tests/*"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "class .*\\(Protocol\\):",
]
